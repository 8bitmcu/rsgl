[package]
name = "rsgl"
version = "0.2.9"
edition = "2021"

[dependencies]
# no accesskit: skips building the screen reader stack and its D-Bus setup at startup
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# not used directly: keeps winit's default features (wayland-dlopen, adwaita window decorations) that eframe's defaults turned on
winit = "0.30"
# only file:// png/jpeg/webp are loaded; all_loaders also built svg (resvg) and http (ehttp)
egui_extras = { version = "0.31", default-features = false, features = ["file", "image", "webp"] }
# the default formats pull in avif (the rav1e encoder), exr, tiff and more that we never read
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
directories = "5"
# gamepad input; on Linux it links libudev (build needs libudev-dev / systemd-devel)
gilrs = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
# lists the config keys serde skipped, so typos like [evn] get a warning
serde_ignored = "0.1.14"
toml = "1.1.8"
ureq = { version = "2", features = ["json"] }
urlencoding = "2.1.3"

[dev-dependencies]
# tests parse real IGDB responses; ureq already pulls it in
serde_json = "1"

# kill/waitpid for watching the game's process group after the window closes
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# debug info for dependencies is rarely needed and makes building and linking slower
[profile.dev.package."*"]
debug = false

# blurring backgrounds is ~25x slower unoptimized
[profile.dev.package.image]
opt-level = 3

# covers are decoded on the UI thread, so unoptimized decoders stall the first frames
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3
