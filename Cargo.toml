[package]
name = "rsgl"
version = "0.2.11"
edition = "2021"

[dependencies]
# no accesskit: skips building the screen reader stack and its D-Bus setup at startup
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# not used directly: keeps winit's default features (wayland-dlopen, adwaita window decorations) that eframe's defaults turned on
winit = "0.30"
# the default formats pull in avif (the rav1e encoder), exr, tiff and more that we never read
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
directories = "5"
# gamepad input; on Linux it links libudev (build needs libudev-dev / systemd-devel)
gilrs = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
# lists the config keys serde skipped, so typos like [evn] get a warning
serde_ignored = "0.1.14"
toml = "1.1.8"
ureq = { version = "2", features = ["json"] }
urlencoding = "2.1.3"
# ROM hashes for Hasheous; no dependencies of its own
sha1_smol = "1.0.1"
# reads the ROM inside a zipped ROM; the defaults add bzip2, lzma, zstd and AES that ROM sets don't use
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
# reads Lutris's game library (pga.db); bundled builds SQLite in, so no system package is needed
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dev-dependencies]
# tests parse real IGDB responses; ureq already pulls it in
serde_json = "1"

# kill/waitpid for watching the game's process group after the window closes
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# debug info for dependencies is rarely needed and makes building and linking slower
[profile.dev.package."*"]
debug = false

# blurring backgrounds is ~25x slower unoptimized
[profile.dev.package.image]
opt-level = 3

# unoptimized decoders take seconds to bring up a screenful of covers
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

# Release is built for size (20.6 MB -> 10.5 MB on Linux x86_64): stripping symbols,
# fat LTO with one codegen unit, and "s". The decoders, resize/blur and the
# texture upload conversion stay at 3; at "s" covers and heroes decode 30-50% slower.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.ecolor]
opt-level = 3
