name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libx11-dev libxcb1-dev libgl1-mesa-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          NAME="rsgl-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir "$NAME"
          cp target/release/rsgl "$NAME/"
          if [ -f README.md ]; then cp README.md "$NAME/"; fi
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rsgl-${{ matrix.arch }}
          path: |
            rsgl-*.tar.gz
            rsgl-*.sha256

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "rsgl-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/rsgl.exe $name/
          if (Test-Path README.md) { Copy-Item README.md $name/ }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rsgl-windows-x86_64
          path: |
            rsgl-*.zip
            rsgl-*.sha256

  release:
    needs: [build, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rsgl-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rsgl-*.tar.gz
            rsgl-*.zip
            rsgl-*.sha256
          generate_release_notes: true
